spring:
  application:
    name: multi-agent-ai-debate-system
  config:
    import: optional:file:.env[.properties]

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080

debate:
  execution:
    thread-pool-size: 6
  retry:
    max-attempts: 2
    backoff-millis: 200
  timeout:
    per-agent-millis: 25000
  llm:
    provider: groq
    timeout-millis: 20000
    max-attempts: 2
    providers:
      groq:
        api-key: ${GROQ_API_KEY:}
        base-url: https://api.groq.com/openai/v1/chat/completions
        model: llama-3.3-70b-versatile
    gemini:
      model: gemini-2.5-flash
      timeout-seconds: 30
      base-url: https://generativelanguage.googleapis.com/v1beta
    agents:
      optimist:
        provider: groq
        temperature: 0.6
      skeptic:
        provider: groq
        temperature: 0.3
      risk:
        provider: groq
        temperature: 0.2
      moderator:
        provider: groq
        temperature: 0.2
